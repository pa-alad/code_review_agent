[project]
name = "code-review-agent"
version = "0.1.0"
description = "Portable, lens-based GitHub code review agent"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.29",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "pytest-asyncio>=0.24,<0.25"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
include = ["app*"]
